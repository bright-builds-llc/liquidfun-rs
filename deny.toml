[graph]
all-features = true

[advisories]
# Neither advisory has a safe upgrade in Macroquad 0.4.15's graph. That graph
# is confined to the private, non-default, unpublished diagnostic testbed; the
# published liquidfun package is isolated from it. Phase 12 must replace the
# renderer before any release-readiness claim.
ignore = ["RUSTSEC-2025-0035", "RUSTSEC-2026-0192"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
# Workspace path dependencies are intentionally unversioned because these crates
# are private and released only through the root workspace.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
