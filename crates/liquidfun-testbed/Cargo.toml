[package]
name = "liquidfun-testbed"
version = "0.0.0"
description = "Private visual testbed and renderer capability gate for liquidfun-rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "liquidfun-testbed"

[[bin]]
name = "interactive"
path = "src/bin/interactive.rs"
test = false
bench = false

[dependencies]
eframe = "=0.35.0"
egui = "=0.35.0"
liquidfun = { path = "../liquidfun" }
liquidfun-differential = { path = "../liquidfun-differential" }
liquidfun-test-protocol = { path = "../liquidfun-test-protocol" }
macroquad = "=0.4.15"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tiny-skia = "=0.12.0"

[lints]
workspace = true
