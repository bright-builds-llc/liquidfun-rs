[package]
name = "liquidfun-wasm"
version = "0.0.0"
description = "Private WebAssembly bridge for the liquidfun-rs browser playground"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dam-break-bench"
path = "src/bin/dam_break_bench.rs"
test = false
bench = false

[[bin]]
name = "dam-break-timers"
path = "src/bin/dam_break_timers.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
liquidfun = { path = "../liquidfun" }
wasm-bindgen = "=0.2.128"
