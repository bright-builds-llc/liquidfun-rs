[workspace]
members = ["crates/liquidfun", "tools/xtask"]
default-members = ["crates/liquidfun"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/bright-builds-llc/liquidfun-rs"
readme = "README.md"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
