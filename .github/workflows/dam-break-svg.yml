name: Dam Break animated SVG

# Post-merge job. After a push to main, regenerate the default Dam Break
# 10 second SVG and the README section that embeds it. Commit only when
# those files changed.
#
# Push access:
# - permissions.contents: write lets this workflow ask GITHUB_TOKEN to push.
# - That is enough when the repository (or organization) allows Actions to
#   write contents. A GITHUB_TOKEN push does not start another workflow run.
# - If the repository maximum is read-only, or branch protection rejects
#   github-actions[bot], set the BRIGHT_BUILDS_PUSH_TOKEN secret to a token
#   that can push to main. The same secret is used by Bright Builds auto-update.
#   A token push can start workflows again. This workflow ignores a commit
#   that only touches the SVG and README, and the publisher exits without a
#   commit when the generated bytes already match.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/assets/demos/dam-break-10s.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dam-break-animated-svg
  cancel-in-progress: true

jobs:
  update-readme-svg:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          token: ${{ secrets.BRIGHT_BUILDS_PUSH_TOKEN || github.token }}
          persist-credentials: true
          submodules: false
      - name: Install pinned Rust and wasm32 target
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.0
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Generate the Dam Break SVG and README section
        run: |
          bun scripts/web-build.ts wasm
          cd web && bun run dam-break-svg
      - name: Commit when the SVG or README changed
        run: bash scripts/publish-dam-break-svg.sh
