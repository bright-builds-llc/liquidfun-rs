name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# D-14: no path filters; every main/PR run builds WASM + web/ from this checkout.
# D-16: cancel-in-progress is false on main so an in-flight deploy finishes;
# queued main revisions coalesce instead of stranding a newer SHA behind a cancelled publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out sources without the native reference checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false
      - name: Name the WASM package cache
        # The package is a pure function of these inputs. The archive is
        # stored outside the repo because web/src/generated is gitignored,
        # and actions/cache skips gitignored paths.
        run: |
          echo "WASM_PACKAGE_CACHE_KEY=pages-wasm-package-v1-${{ runner.os }}-${{ runner.arch }}-1.97.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'crates/**', 'scripts/web-build.ts', 'scripts/install-wasm-pack.sh') }}" >> "$GITHUB_ENV"
      - name: Restore the generated WASM package
        # actions/cache/restore v6
        id: wasm-package
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/liquidfun-wasm-package.tar.gz
          key: ${{ env.WASM_PACKAGE_CACHE_KEY }}
      - name: Extract the restored WASM package
        if: success() && steps.wasm-package.outputs.cache-hit == 'true'
        run: |
          mkdir -p web/src/generated
          tar -xzf "$RUNNER_TEMP/liquidfun-wasm-package.tar.gz" -C web/src/generated
      - name: Install pinned Rust and wasm32 target
        if: success() && steps.wasm-package.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.0
      - name: Install pinned wasm-pack
        if: success() && steps.wasm-package.outputs.cache-hit != 'true'
        run: bash scripts/install-wasm-pack.sh
      - name: Install Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Build WASM and production site
        env:
          LIQUIDFUN_REUSE_WASM_PACKAGE: ${{ steps.wasm-package.outputs.cache-hit }}
          VITE_APP_VERSION: "0.0.0"
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_ID: ${{ github.run_id }}
          VITE_BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun scripts/web-build.ts build
      - name: Archive the generated WASM package
        if: success() && steps.wasm-package.outputs.cache-hit != 'true'
        run: tar -C web/src/generated -czf "$RUNNER_TEMP/liquidfun-wasm-package.tar.gz" liquidfun-wasm
      - name: Save the generated WASM package
        if: success() && steps.wasm-package.outputs.cache-hit != 'true'
        # actions/cache/save v6
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/liquidfun-wasm-package.tar.gz
          key: ${{ env.WASM_PACKAGE_CACHE_KEY }}
      - name: Configure GitHub Pages
        # actions/configure-pages v6
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload site artifact
        # actions/upload-pages-artifact v5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # D-15: OIDC deploy only; job-scoped pages: write + id-token: write; no PAT;
    # official SHA-pinned Pages actions; github-pages environment.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        # actions/deploy-pages v5
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
