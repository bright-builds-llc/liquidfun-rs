name: Phase 12 coverage evidence

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase commit SHA to evaluate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase12-coverage-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}

jobs:
  rust-coverage:
    name: Rust source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact candidate without C++ sources
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Validate candidate identity
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust coverage tools
        run: |
          rustup toolchain install nightly-2026-07-15 \
            --profile minimal \
            --component llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          test "$(cargo llvm-cov --version)" = "cargo-llvm-cov 0.8.7"
      - name: Produce validated Rust coverage
        run: |
          scripts/phase12-coverage.sh check
          scripts/phase12-coverage.sh rust "$CANDIDATE_SHA"
      - name: Verify identity-last Rust coverage output
        run: |
          evidence="target/phase12-coverage/$CANDIDATE_SHA/rust"
          test -s "$evidence/summary.json"
          test -s "$evidence/identity.json"
          test "$evidence/identity.json" -nt "$evidence/summary.json"
          test "$(jq -r '.candidate_commit' "$evidence/identity.json")" = "$CANDIDATE_SHA"
          test "$(jq -r '.evidence_kind' "$evidence/identity.json")" = "rust_coverage"
          test "$(jq -r '.toolchain_identity' "$evidence/identity.json")" = "nightly-2026-07-15"
          test "$(jq -r '.parity_authority' "$evidence/identity.json")" = "false"
          expected="$(jq -r '.payload_sha256' "$evidence/identity.json")"
          test "$(sha256sum "$evidence/summary.json" | awk '{print $1}')" = "$expected"
      - name: Upload candidate-scoped Rust coverage
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase12-rust-coverage-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}
          path: target/phase12-coverage/${{ env.CANDIDATE_SHA }}/rust
          if-no-files-found: error
          retention-days: 14

  cpp-coverage:
    name: C++ oracle source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact candidate and pinned upstream
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive
      - name: Validate candidate identity
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install canonical LLVM 22
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          echo "9474ecd78b52aba6e923976b1e9773f5613027cc7e237b9956986cb536e02a36  $RUNNER_TEMP/llvm.sh" |
            sha256sum --check
          chmod 755 "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Install exact CMake and Ninja
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/cmake.tar.gz" \
            https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz
          echo "927b2368a946c37269c3a66225ab00544e756459cdd0b5d0da438694fb9ff802  $RUNNER_TEMP/cmake.tar.gz" |
            sha256sum --check
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ninja-1.13.2"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/ninja.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          echo "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  $RUNNER_TEMP/ninja.zip" |
            sha256sum --check
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/ninja-1.13.2"
          {
            echo "$RUNNER_TEMP/cmake-4.3.3-linux-x86_64/bin"
            echo "$RUNNER_TEMP/ninja-1.13.2"
          } >> "$GITHUB_PATH"
      - name: Assert canonical tool identities
        run: |
          clang++-22 --version | grep --extended-regexp 'clang version 22\.1\.8'
          cmake --version | grep --fixed-strings "cmake version 4.3.3"
          ninja --version | grep --fixed-strings "1.13.2"
      - name: Produce validated C++ coverage
        run: |
          scripts/phase12-coverage.sh check
          scripts/phase12-coverage.sh cpp "$CANDIDATE_SHA"
      - name: Verify identity-last C++ coverage output
        run: |
          evidence="target/phase12-coverage/$CANDIDATE_SHA/cpp"
          test -s "$evidence/summary.json"
          test -s "$evidence/identity.json"
          test "$evidence/identity.json" -nt "$evidence/summary.json"
          test "$(jq -r '.candidate_commit' "$evidence/identity.json")" = "$CANDIDATE_SHA"
          test "$(jq -r '.evidence_kind' "$evidence/identity.json")" = "cpp_coverage"
          test "$(jq -r '.toolchain_identity' "$evidence/identity.json")" = "clang-22.1.8"
          test "$(jq -r '.parity_authority' "$evidence/identity.json")" = "false"
          expected="$(jq -r '.payload_sha256' "$evidence/identity.json")"
          test "$(sha256sum "$evidence/summary.json" | awk '{print $1}')" = "$expected"
      - name: Upload candidate-scoped C++ coverage
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase12-cpp-coverage-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}
          path: target/phase12-coverage/${{ env.CANDIDATE_SHA }}/cpp
          if-no-files-found: error
          retention-days: 14

  differential-coverage:
    name: Differential semantic leaves
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact candidate without C++ startup
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Validate candidate identity
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Produce validated differential leaves
        run: |
          scripts/phase12-coverage.sh check
          scripts/phase12-coverage.sh differential "$CANDIDATE_SHA"
      - name: Verify identity-last differential output
        run: |
          evidence="target/phase12-coverage/$CANDIDATE_SHA/differential"
          test -s "$evidence/summary.json"
          test -s "$evidence/identity.json"
          test "$evidence/identity.json" -nt "$evidence/summary.json"
          test "$(jq -r '.candidate_commit' "$evidence/identity.json")" = "$CANDIDATE_SHA"
          test "$(jq -r '.evidence_kind' "$evidence/identity.json")" = "differential_coverage"
          test "$(jq -r '.toolchain_identity' "$evidence/identity.json")" = "semantic-leaf-v1"
          test "$(jq -r '.parity_authority' "$evidence/identity.json")" = "false"
          expected="$(jq -r '.payload_sha256' "$evidence/identity.json")"
          test "$(sha256sum "$evidence/summary.json" | awk '{print $1}')" = "$expected"
      - name: Upload candidate-scoped differential coverage
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase12-differential-coverage-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}
          path: target/phase12-coverage/${{ env.CANDIDATE_SHA }}/differential
          if-no-files-found: error
          retention-days: 14
