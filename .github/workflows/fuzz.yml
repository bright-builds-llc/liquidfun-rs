name: Bounded fuzzing

on:
  pull_request:
  schedule:
    - cron: "23 4 * * 4"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to fuzz
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FUZZ_NIGHTLY: nightly-2026-07-15
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  build:
    name: Build all fuzz targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sources without the native reference checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false
      - name: Install the exact fuzz toolchain
        run: rustup toolchain install nightly-2026-07-15 --profile minimal --component rust-src
      - name: Install the exact cargo-fuzz release
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build all five bounded targets
        run: cargo +nightly-2026-07-15 fuzz build

  fuzz:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: protocol
            maximum_length: 1048576
          - target: shapes_collision
            maximum_length: 4352
          - target: world_mutation
            maximum_length: 4352
          - target: particles
            maximum_length: 4352
          - target: groups_ownership
            maximum_length: 4352
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
      FUZZ_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '1800' || '600' }}
      FUZZ_TARGET: ${{ matrix.target }}
      MAXIMUM_LENGTH: ${{ matrix.maximum_length }}
    steps:
      - name: Check out the exact candidate
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
          submodules: false
      - name: Validate the candidate identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'candidate_sha must be an exact 40-character commit SHA\n' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA,,}"
      - name: Install the exact fuzz toolchain
        run: rustup toolchain install nightly-2026-07-15 --profile minimal --component rust-src
      - name: Install the exact cargo-fuzz release
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run one bounded fuzz campaign and minimize its finding
        id: campaign
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="target/fuzz-evidence/${FUZZ_TARGET}"
          mkdir -p "$evidence_dir"

          set +e
          cargo +nightly-2026-07-15 fuzz run "$FUZZ_TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" \
            -max_len="$MAXIMUM_LENGTH" \
            -timeout=10 \
            -artifact_prefix="${evidence_dir}/raw-" \
            > "${evidence_dir}/full.log" 2>&1
          fuzz_exit_code=$?
          set -e

          tail --bytes=262144 "${evidence_dir}/full.log" > "${evidence_dir}/fuzz.log"
          unlink "${evidence_dir}/full.log"

          classification_json=null
          outcome=pass
          if [[ "$fuzz_exit_code" -ne 0 ]]; then
            outcome=finding
            classification_json='"Harness"'
            if grep --extended-regexp --ignore-case --quiet 'addresssanitizer|undefinedbehaviorsanitizer|memorysanitizer|leaksanitizer' "${evidence_dir}/fuzz.log"; then
              classification_json='"Sanitizer"'
            elif [[ "$fuzz_exit_code" -eq 124 ]] || grep --extended-regexp --ignore-case --quiet 'timeout|timed out|deadly signal' "${evidence_dir}/fuzz.log"; then
              classification_json='"Timeout"'
            elif grep --extended-regexp --ignore-case --quiet 'schema|deserialize|jsonl|protocol version' "${evidence_dir}/fuzz.log"; then
              classification_json='"Schema"'
            elif grep --extended-regexp --ignore-case --quiet 'panicked|assertion failed|committed engine invariant' "${evidence_dir}/fuzz.log"; then
              classification_json='"PhysicsMismatch"'
            fi

            mapfile -t raw_findings < <(find "$evidence_dir" -maxdepth 1 -type f -name 'raw-*' -print)
            if [[ "${#raw_findings[@]}" -gt 0 ]]; then
              set +e
              timeout 300s cargo +nightly-2026-07-15 fuzz tmin \
                "$FUZZ_TARGET" "${raw_findings[0]}" -- \
                -exact_artifact_path="${evidence_dir}/minimized-input" \
                > "${evidence_dir}/minimize-full.log" 2>&1
              minimize_exit_code=$?
              set -e
              tail --bytes=131072 "${evidence_dir}/minimize-full.log" > "${evidence_dir}/minimize.log"
              unlink "${evidence_dir}/minimize-full.log"
              printf '%s\n' "$minimize_exit_code" > "${evidence_dir}/minimize-exit-code.txt"
            fi
          fi

          find "$evidence_dir" -maxdepth 1 -type f -name 'raw-*' -delete
          rust_identity=$(rustc +nightly-2026-07-15 --version)
          printf '{"target":"%s","candidate_sha":"%s","generator":"cargo-fuzz %s","toolchain":"%s","maximum_length":%s,"seconds":%s}\n' \
            "$FUZZ_TARGET" "$CANDIDATE_SHA" "$CARGO_FUZZ_VERSION" "$rust_identity" "$MAXIMUM_LENGTH" "$FUZZ_SECONDS" \
            > "${evidence_dir}/identity.json"
          printf '{"outcome":"%s","classification":%s,"exit_code":%s}\n' \
            "$outcome" "$classification_json" "$fuzz_exit_code" \
            > "${evidence_dir}/classification.json"

          exit "$fuzz_exit_code"
      - name: Upload only bounded finding evidence
        if: always()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ env.CANDIDATE_SHA }}
          path: target/fuzz-evidence/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
