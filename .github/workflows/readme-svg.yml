name: Readme scene previews

# Post-merge job. After a push to main, regenerate one 10 second SVG per
# catalog scene, rasterize it to a 60 fps animated WebP, and refresh the
# README gallery that embeds the WebP. The SVG stays in the repo. Commit
# only when those files changed.
#
# Push access:
# - permissions.contents: write lets this workflow ask GITHUB_TOKEN to push.
# - That is enough when the repository (or organization) allows Actions to
#   write contents. A GITHUB_TOKEN push does not start another workflow run.
# - If the repository maximum is read-only, or branch protection rejects
#   github-actions[bot], set the BRIGHT_BUILDS_PUSH_TOKEN secret to a token
#   that can push to main. The same secret is used by Bright Builds auto-update.
#   A token push can start workflows again. This workflow ignores a commit
#   that only touches the previews and README, and the publisher exits without a
#   commit when the generated bytes already match.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/assets/readme/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-animated-svg
  cancel-in-progress: true

jobs:
  update-readme-svgs:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out main
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          token: ${{ secrets.BRIGHT_BUILDS_PUSH_TOKEN || github.token }}
          persist-credentials: true
          submodules: false
      - name: Install pinned Rust and wasm32 target
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.97.0
      - name: Install pinned wasm-pack
        run: bash scripts/install-wasm-pack.sh
      - name: Install Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install ffmpeg and DejaVu Sans
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate scene SVGs, WebP previews, and the README gallery
        run: |
          bun scripts/web-build.ts wasm
          cd web && bun install --frozen-lockfile && bun run readme-svg
      - name: Commit when a preview or the README changed
        run: bash scripts/publish-readme-svg.sh
