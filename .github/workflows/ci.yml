name: Cargo CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Linux quality and isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources without the native reference checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false
      - name: Install pinned Python for Markdown formatting
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Check Markdown formatting
        run: |
          python -m venv "${RUNNER_TEMP}/mdformat-venv"
          "${RUNNER_TEMP}/mdformat-venv/bin/python" -m pip install --disable-pip-version-check mdformat==1.0.0
          "${RUNNER_TEMP}/mdformat-venv/bin/mdformat" --check .
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
      - name: Cache Cargo inputs and outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-quality-1.97.0-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build the workspace
        run: cargo build --workspace --all-targets --all-features
      - name: Test the workspace
        run: cargo test --workspace --all-features
      - name: Prove headless workflows and consumer package isolation
        run: |
          cargo test -p liquidfun --all-features --test phase11_public_observability
          cargo test -p liquidfun-differential --test headless_catalog
          cargo test -p xtask --test package_cli
          cargo xtask package verify
      - name: Close the checked semantic corpus without native source
        run: |
          cargo xtask inventory corpus check-snapshot
          cargo xtask inventory corpus check-closure
          cargo xtask inventory corpus generate-report
          git diff --exit-code -- UPSTREAM-CORPUS.md
      - name: Build and test private tooling and the selected testbed headlessly
        env:
          DISPLAY: ""
          WAYLAND_DISPLAY: ""
          MIR_SOCKET: ""
          XDG_RUNTIME_DIR: ""
        run: |
          cargo build -p xtask -p liquidfun-test-protocol -p liquidfun-differential -p liquidfun-benchmarks --all-targets --all-features
          cargo test -p xtask -p liquidfun-test-protocol -p liquidfun-differential -p liquidfun-benchmarks --all-features
          cargo build -p liquidfun-testbed --all-targets --all-features
          cargo test -p liquidfun-testbed --all-features
      - name: Test protocol schema and fixture contracts
        run: |
          cargo test -p liquidfun-test-protocol --all-features --lib schema::tests
          cargo test -p liquidfun-test-protocol --all-features --test fixtures
      - name: Test typed comparison and deterministic minimization
        run: |
          cargo test -p liquidfun-differential --all-features --test comparison
          cargo test -p liquidfun-differential --all-features --test minimizer
      - name: Test supervisor failure injection
        run: cargo test -p liquidfun-differential --all-features --test supervisor_failures
      - name: Test provenance schema fixtures
        run: cargo test -p xtask --test provenance_cli
      - name: Test documentation contracts
        run: |
          cargo test -p xtask --test docs_contract
          cargo xtask docs check
      - name: Build documentation with denied warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Exercise inventory checks without the native reference tree
        run: cargo test -p xtask --test inventory_cli
  default-features:
    name: Default features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Every matrix expansion preserves the checkout's submodules: false isolation.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - name: Check out sources without the native reference checkout
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          submodules: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache Cargo inputs and outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-defaults-1.97.0-${{ hashFiles('Cargo.lock') }}
      - name: Build default features
        run: cargo build -p liquidfun
      - name: Test default features
        run: cargo test -p liquidfun
      - name: Test public math contracts and numerical policy
        run: |
          cargo test -p liquidfun --all-features math
          cargo test -p liquidfun-test-protocol --all-features phase4
