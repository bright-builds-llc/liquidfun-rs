name: Oracle CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      evidence_phase:
        description: Evidence corpus to run
        required: true
        default: phase8
        type: choice
        options:
          - phase8
          - phase9

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  canonical-linux:
    name: Canonical Linux oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang-22
      CXX: clang++-22
      LIQUIDFUN_XTASK_CMAKE: cmake
      LIQUIDFUN_XTASK_NINJA: ninja
      LIQUIDFUN_XTASK_CXX: clang++-22
    steps:
      - name: Check out sources and the pinned oracle
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install canonical LLVM 22
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          echo "9474ecd78b52aba6e923976b1e9773f5613027cc7e237b9956986cb536e02a36  $RUNNER_TEMP/llvm.sh" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 22
      - name: Install exact CMake and Ninja
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/cmake.tar.gz" https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz
          echo "927b2368a946c37269c3a66225ab00544e756459cdd0b5d0da438694fb9ff802  $RUNNER_TEMP/cmake.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ninja-1.13.2"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/ninja.zip" https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          echo "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  $RUNNER_TEMP/ninja.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/ninja-1.13.2"
          {
            echo "$RUNNER_TEMP/cmake-4.3.3-linux-x86_64/bin"
            echo "$RUNNER_TEMP/ninja-1.13.2"
          } >> "$GITHUB_PATH"
      - name: Assert canonical tool identities
        run: |
          cmake --version | grep --fixed-strings "cmake version 4.3.3"
          test "$(ninja --version)" = "1.13.2"
          clang++-22 --version | grep --extended-regexp 'clang version 22\.1\.8'
      - name: Cache oracle build outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-oracle-phase8-${{ hashFiles('Cargo.lock', 'reference/upstream-lock.toml', 'protocol/tolerances/phase8-v1.toml', 'protocol/fixtures/accepted/rigid-world-request.jsonl', 'tools/reference/CMakeLists.txt', 'tools/reference/CMakePresets.json') }}
      - name: Verify the exact upstream checkout
        run: cargo xtask upstream verify
      - name: Verify provenance records
        run: cargo xtask provenance check
      - name: Verify compatibility inventory
        run: cargo xtask inventory check
      - name: Configure oracle-debug
        run: cargo xtask upstream configure --preset oracle-debug
      - name: Build oracle-debug
        run: cargo xtask upstream build --preset oracle-debug
      - name: Configure oracle-release
        run: cargo xtask upstream configure --preset oracle-release
      - name: Build oracle-release
        run: cargo xtask upstream build --preset oracle-release
      - name: Reject incomplete or forbidden canonical identities
        run: cargo test -p liquidfun-test-protocol --all-features canonical
      - name: Verify the closed Phase 8 policy
        run: cargo test -p liquidfun-test-protocol --all-features phase8
      - name: Compare Phase 4 math probes in debug and release
        run: |
          cargo xtask differential compare --scenario math-probes --preset oracle-debug --session-profile one-shot
          cargo xtask differential compare --scenario math-probes --preset oracle-release --session-profile one-shot
      - name: Replay Phase 4 math probes
        run: cargo xtask differential replay --scenario math-probes --preset oracle-debug --session-profile one-shot
      - name: Verify Phase 4 D0 byte stability
        run: cargo xtask differential verify-determinism --scenario math-probes --preset oracle-debug --runs 2
      - name: Compare Phase 5 collision probes in debug and release
        run: |
          cargo xtask differential compare --scenario collision-probes --preset oracle-debug --session-profile one-shot
          cargo xtask differential compare --scenario collision-probes --preset oracle-release --session-profile one-shot
      - name: Replay Phase 5 collision probes
        run: cargo xtask differential replay --scenario collision-probes --preset oracle-debug --session-profile one-shot
      - name: Verify Phase 5 collision D0 byte stability
        run: cargo xtask differential verify-determinism --scenario collision-probes --preset oracle-debug --runs 2
      - name: Prepare Phase 8 canonical evidence logs
        run: mkdir -p target/oracle-evidence/phase8-canonical/logs
      - name: Compare Phase 8 rigid world in debug and release
        run: |
          cargo xtask differential compare --scenario rigid-world --preset oracle-debug --session-profile one-shot 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/compare-debug.log
          cargo xtask differential compare --scenario rigid-world --preset oracle-release --session-profile one-shot 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/compare-release.log
      - name: Replay the Phase 8 rigid world
        run: cargo xtask differential replay --scenario rigid-world --preset oracle-debug --session-profile one-shot 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/replay.log
      - name: Verify Phase 8 rigid D0 byte stability
        run: cargo xtask differential verify-determinism --scenario rigid-world --preset oracle-debug --runs 2 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/determinism.log
      - name: Compare empty-world in one-shot isolation
        run: cargo xtask differential compare --scenario empty-world --preset oracle-debug --session-profile one-shot
      - name: Compare the bounded two-request reuse session
        run: cargo xtask differential compare --scenario empty-world --preset oracle-debug --session-profile reuse
      - name: Replay the reviewed empty-world trace
        run: cargo xtask differential replay --scenario empty-world --preset oracle-debug --session-profile one-shot
      - name: Recheck provenance and assert evidence stayed read-only
        run: |
          cargo xtask provenance check 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/provenance.log
          git diff --exit-code -- protocol scenarios reference COMPATIBILITY.md 2>&1 | tee target/oracle-evidence/phase8-canonical/logs/read-only.log
      - name: Write exact Phase 8 canonical identity
        run: |
          printf '%s\n' '{"run_id":${{ github.run_id }},"head_sha":"${{ github.sha }}","job":"${{ github.job }}","upstream_revision":"7f20402173fd143a3988c921bc384459c6a858f2","rust":"1.97.0","cmake":"4.3.3","ninja":"1.13.2","clang":"22.1.8","policy_profile":"phase8-v1"}' > target/oracle-evidence/phase8-canonical/identity.json
      - name: Upload Phase 8 canonical evidence
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-canonical-${{ github.run_id }}-${{ github.sha }}
          path: target/oracle-evidence/phase8-canonical
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Phase 9 canonical evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: mkdir -p target/oracle-evidence/phase9-canonical
      - name: Run the closed Phase 9 canonical corpus, replay, and D0 checks
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        env:
          LIQUIDFUN_PHASE9_ORACLE_MODE: canonical
        run: cargo test -p liquidfun-differential --test phase9_corpus -- --nocapture 2>&1 | tee target/oracle-evidence/phase9-canonical/phase9-trace.log
      - name: Recheck Phase 9 provenance, inventory, and read-only boundaries
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: |
          cargo xtask provenance check 2>&1 | tee target/oracle-evidence/phase9-canonical/provenance.log
          cargo xtask inventory check 2>&1 | tee target/oracle-evidence/phase9-canonical/inventory.log
          git diff --exit-code -- protocol scenarios reference COMPATIBILITY.md 2>&1 | tee target/oracle-evidence/phase9-canonical/read-only.log
      - name: Write exact Phase 9 canonical artifact identity
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: |
          jq -n \
            --arg policy phase9-v1 \
            --arg corpus crates/liquidfun-differential/tests/fixtures/rigid_world/phase9/phase9-v1.json \
            --argjson d0_runs 2 \
            '{policy: $policy, corpus: $corpus, profiles: ["oracle-debug", "oracle-release"], replay: true, d0_runs: $d0_runs}' \
            > target/oracle-evidence/phase9-canonical/phase9-manifest.json
          trace_sha=$(sha256sum target/oracle-evidence/phase9-canonical/phase9-trace.log | cut -d ' ' -f 1)
          manifest_sha=$(sha256sum target/oracle-evidence/phase9-canonical/phase9-manifest.json | cut -d ' ' -f 1)
          jq -n \
            --argjson run_id "${{ github.run_id }}" \
            --arg job canonical-linux \
            --arg head_sha "${{ github.sha }}" \
            --arg upstream_revision 7f20402173fd143a3988c921bc384459c6a858f2 \
            --arg rust 1.97.0 \
            --arg cmake 4.3.3 \
            --arg ninja 1.13.2 \
            --arg clang 22.1.8 \
            --arg target x86_64-unknown-linux-gnu \
            --arg policy phase9-v1 \
            --arg trace_sha "$trace_sha" \
            --arg manifest_sha "$manifest_sha" \
            '{run_id: $run_id, job: $job, head_sha: $head_sha, upstream_revision: $upstream_revision, rust: $rust, cmake: $cmake, ninja: $ninja, clang: $clang, target: $target, policy: $policy, trace: {path: "phase9-trace.log", sha256: $trace_sha}, manifest: {path: "phase9-manifest.json", sha256: $manifest_sha}}' \
            > target/oracle-evidence/phase9-canonical/identity.json
      - name: Upload Phase 9 canonical evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase9-canonical-${{ github.run_id }}-${{ github.sha }}
          path: target/oracle-evidence/phase9-canonical
          if-no-files-found: error
          retention-days: 30

  sanitizer-linux:
    name: Scheduled fail-fast sanitizer and reset corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang-22
      CXX: clang++-22
      LIQUIDFUN_XTASK_CMAKE: cmake
      LIQUIDFUN_XTASK_NINJA: ninja
      LIQUIDFUN_XTASK_CXX: clang++-22
    steps:
      - name: Check out sources and the pinned oracle
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install canonical LLVM 22
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          echo "9474ecd78b52aba6e923976b1e9773f5613027cc7e237b9956986cb536e02a36  $RUNNER_TEMP/llvm.sh" | sha256sum --check
          chmod 755 "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Install exact CMake and Ninja
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/cmake.tar.gz" https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz
          echo "927b2368a946c37269c3a66225ab00544e756459cdd0b5d0da438694fb9ff802  $RUNNER_TEMP/cmake.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ninja-1.13.2"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/ninja.zip" https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
          echo "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6  $RUNNER_TEMP/ninja.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/ninja-1.13.2"
          {
            echo "$RUNNER_TEMP/cmake-4.3.3-linux-x86_64/bin"
            echo "$RUNNER_TEMP/ninja-1.13.2"
          } >> "$GITHUB_PATH"
      - name: Assert canonical tool identities
        run: |
          cmake --version | grep --fixed-strings "cmake version 4.3.3"
          test "$(ninja --version)" = "1.13.2"
          clang++-22 --version | grep --extended-regexp 'clang version 22\.1\.8'
      - name: Cache sanitizer build outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-oracle-asan-ubsan-${{ hashFiles('Cargo.lock', 'reference/upstream-lock.toml', 'tools/reference/CMakeLists.txt', 'tools/reference/CMakePresets.json') }}
      - name: Verify the exact upstream checkout and provenance
        run: |
          cargo xtask upstream verify
          cargo xtask provenance check
          cargo test -p liquidfun-test-protocol --all-features phase8
      - name: Configure oracle-asan-ubsan
        run: cargo xtask upstream configure --preset oracle-asan-ubsan
      - name: Build oracle-asan-ubsan
        run: cargo xtask upstream build --preset oracle-asan-ubsan
      - name: Build rigid reference protocol tests
        run: cmake --build target/reference/oracle-asan-ubsan --target liquidfun-reference-protocol-tests
      - name: Run rigid reference protocol tests under fail-fast sanitizers
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ASAN_OPTIONS=abort_on_error=1:halt_on_error=1 ctest --test-dir target/reference/oracle-asan-ubsan --output-on-failure --no-tests=error -R '^liquidfun-reference-protocol$'
      - name: Prepare Phase 8 sanitizer evidence logs
        run: mkdir -p target/oracle-evidence/phase8-sanitizer/logs
      - name: Compare the Phase 8 rigid world under fail-fast sanitizers
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ASAN_OPTIONS=abort_on_error=1:halt_on_error=1 cargo xtask differential compare --scenario rigid-world --preset oracle-asan-ubsan --session-profile one-shot 2>&1 | tee target/oracle-evidence/phase8-sanitizer/logs/compare.log
      - name: Run fail-fast one-shot sanitizer comparison
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ASAN_OPTIONS=abort_on_error=1:halt_on_error=1 cargo xtask differential compare --scenario empty-world --preset oracle-asan-ubsan --session-profile one-shot
      - name: Run bounded reset and reuse sanitizer corpus
        run: UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ASAN_OPTIONS=abort_on_error=1:halt_on_error=1 cargo xtask differential compare --scenario empty-world --preset oracle-asan-ubsan --session-profile sanitizer
      - name: Assert sanitizer evidence stayed read-only
        run: git diff --exit-code -- protocol scenarios reference COMPATIBILITY.md 2>&1 | tee target/oracle-evidence/phase8-sanitizer/logs/read-only.log
      - name: Write exact Phase 8 sanitizer identity
        run: |
          printf '%s\n' '{"run_id":${{ github.run_id }},"head_sha":"${{ github.sha }}","job":"${{ github.job }}","upstream_revision":"7f20402173fd143a3988c921bc384459c6a858f2","rust":"1.97.0","cmake":"4.3.3","ninja":"1.13.2","clang":"22.1.8","policy_profile":"phase8-v1"}' > target/oracle-evidence/phase8-sanitizer/identity.json
      - name: Upload Phase 8 sanitizer evidence
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-sanitizer-${{ github.run_id }}-${{ github.sha }}
          path: target/oracle-evidence/phase8-sanitizer
          if-no-files-found: error
          retention-days: 30
      - name: Prepare Phase 9 sanitizer evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: mkdir -p target/oracle-evidence/phase9-sanitizer
      - name: Run the closed Phase 9 corpus under fail-fast sanitizers
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        env:
          ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LIQUIDFUN_PHASE9_ORACLE_MODE: sanitizer
        run: cargo test -p liquidfun-differential --test phase9_corpus -- --nocapture 2>&1 | tee target/oracle-evidence/phase9-sanitizer/phase9-trace.log
      - name: Recheck Phase 9 sanitizer inventory and read-only boundaries
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: |
          cargo xtask provenance check 2>&1 | tee target/oracle-evidence/phase9-sanitizer/provenance.log
          cargo xtask inventory check 2>&1 | tee target/oracle-evidence/phase9-sanitizer/inventory.log
          git diff --exit-code -- protocol scenarios reference COMPATIBILITY.md 2>&1 | tee target/oracle-evidence/phase9-sanitizer/read-only.log
      - name: Write exact Phase 9 sanitizer artifact identity
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        run: |
          jq -n \
            --arg policy phase9-v1 \
            --arg corpus crates/liquidfun-differential/tests/fixtures/rigid_world/phase9/phase9-v1.json \
            '{policy: $policy, corpus: $corpus, profile: "oracle-asan-ubsan", fail_fast: true}' \
            > target/oracle-evidence/phase9-sanitizer/phase9-manifest.json
          trace_sha=$(sha256sum target/oracle-evidence/phase9-sanitizer/phase9-trace.log | cut -d ' ' -f 1)
          manifest_sha=$(sha256sum target/oracle-evidence/phase9-sanitizer/phase9-manifest.json | cut -d ' ' -f 1)
          jq -n \
            --argjson run_id "${{ github.run_id }}" \
            --arg job sanitizer-linux \
            --arg head_sha "${{ github.sha }}" \
            --arg upstream_revision 7f20402173fd143a3988c921bc384459c6a858f2 \
            --arg rust 1.97.0 \
            --arg cmake 4.3.3 \
            --arg ninja 1.13.2 \
            --arg clang 22.1.8 \
            --arg target x86_64-unknown-linux-gnu \
            --arg policy phase9-v1 \
            --arg trace_sha "$trace_sha" \
            --arg manifest_sha "$manifest_sha" \
            '{run_id: $run_id, job: $job, head_sha: $head_sha, upstream_revision: $upstream_revision, rust: $rust, cmake: $cmake, ninja: $ninja, clang: $clang, target: $target, policy: $policy, trace: {path: "phase9-trace.log", sha256: $trace_sha}, manifest: {path: "phase9-manifest.json", sha256: $manifest_sha}}' \
            > target/oracle-evidence/phase9-sanitizer/identity.json
      - name: Upload Phase 9 sanitizer evidence
        if: github.event_name == 'workflow_dispatch' && inputs.evidence_phase == 'phase9'
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase9-sanitizer-${{ github.run_id }}-${{ github.sha }}
          path: target/oracle-evidence/phase9-sanitizer
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded differential failure evidence
        if: failure()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: differential-failures-${{ github.run_id }}-${{ github.job }}
          path: target/differential/failures
          if-no-files-found: error
          retention-days: 7

  portability-macos:
    name: macOS oracle portability
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      LIQUIDFUN_XTASK_CMAKE: cmake
      LIQUIDFUN_XTASK_NINJA: ninja
      LIQUIDFUN_XTASK_CXX: clang++
    steps:
      - name: Check out sources and the pinned oracle
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install exact CMake and Ninja
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/cmake.tar.gz" https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-macos-universal.tar.gz
          echo "5221a13450c7a0219a2a0d1b6c9085eb06489721fafd8488ccebc1584175d2fb  $RUNNER_TEMP/cmake.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/ninja-1.13.2"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/ninja.zip" https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
          echo "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b  $RUNNER_TEMP/ninja.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/ninja-1.13.2"
          {
            echo "$RUNNER_TEMP/cmake-4.3.3-macos-universal/CMake.app/Contents/bin"
            echo "$RUNNER_TEMP/ninja-1.13.2"
          } >> "$GITHUB_PATH"
      - name: Assert portable tool identities
        run: |
          cmake --version | grep --fixed-strings "cmake version 4.3.3"
          test "$(ninja --version)" = "1.13.2"
          clang++ --version
      - name: Cache oracle build outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-oracle-debug-${{ hashFiles('Cargo.lock', 'reference/upstream-lock.toml', 'tools/reference/CMakeLists.txt', 'tools/reference/CMakePresets.json') }}
      - name: Verify oracle evidence
        run: |
          cargo xtask upstream verify
          cargo xtask provenance check
          cargo xtask inventory check
      - name: Configure oracle-debug
        run: cargo xtask upstream configure --preset oracle-debug
      - name: Build oracle-debug
        run: cargo xtask upstream build --preset oracle-debug

  portability-windows:
    name: Windows oracle portability
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CC: clang-cl
      CXX: clang-cl
      LIQUIDFUN_XTASK_CMAKE: cmake
      LIQUIDFUN_XTASK_NINJA: ninja
      LIQUIDFUN_XTASK_CXX: clang-cl
    steps:
      - name: Check out sources and the pinned oracle
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install exact CMake and Ninja
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-windows-x86_64.zip -OutFile "$env:RUNNER_TEMP\cmake.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\cmake.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne "935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6") { throw "CMake SHA-256 mismatch" }
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\ninja-1.13.2" | Out-Null
          Invoke-WebRequest -Uri https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip -OutFile "$env:RUNNER_TEMP\ninja.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\ninja.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne "07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65") { throw "Ninja SHA-256 mismatch" }
          Expand-Archive -Path "$env:RUNNER_TEMP\ninja.zip" -DestinationPath "$env:RUNNER_TEMP\ninja-1.13.2"
          "$env:RUNNER_TEMP\cmake-4.3.3-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:RUNNER_TEMP\ninja-1.13.2" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Assert portable tool identities
        shell: pwsh
        run: |
          if ((cmake --version | Select-Object -First 1) -ne "cmake version 4.3.3") { throw "unexpected CMake version" }
          if ((ninja --version) -ne "1.13.2") { throw "unexpected Ninja version" }
          clang-cl --version
      - name: Cache oracle build outputs
        # actions/cache v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: ${{ runner.os }}-oracle-debug-${{ hashFiles('Cargo.lock', 'reference/upstream-lock.toml', 'tools/reference/CMakeLists.txt', 'tools/reference/CMakePresets.json') }}
      - name: Verify and build with the native Visual Studio environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools are unavailable" }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          cargo xtask upstream verify
          cargo xtask provenance check
          cargo xtask inventory check
          cargo xtask upstream configure --preset oracle-debug
          cargo xtask upstream build --preset oracle-debug
